<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Commercial and multifamily properties">
  <defs>
    <linearGradient id="cp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2f8"/>
      <stop offset="1" stop-color="#ccdcee"/>
    </linearGradient>
  </defs>
  <rect width="700" height="500" fill="url(#cp)"/>
  <polygon points="0,400 700,300 700,500 0,500" fill="#ffffff" opacity="0.4"/>
  <!-- tower -->
  <g fill="#123A66" opacity="0.45">
    <rect x="380" y="90" width="210" height="330" rx="8"/>
  </g>
  <g fill="#ffffff" opacity="0.6">
    <rect x="408" y="126" width="46" height="46" rx="4"/><rect x="482" y="126" width="46" height="46" rx="4"/>
    <rect x="408" y="200" width="46" height="46" rx="4"/><rect x="482" y="200" width="46" height="46" rx="4"/>
    <rect x="408" y="274" width="46" height="46" rx="4"/><rect x="482" y="274" width="46" height="46" rx="4"/>
  </g>
  <!-- low-rise -->
  <g fill="#1B4F8A" opacity="0.5">
    <rect x="110" y="200" width="230" height="220" rx="8"/>
  </g>
  <g fill="#ffffff" opacity="0.65">
    <rect x="140" y="234" width="52" height="40" rx="4"/><rect x="212" y="234" width="52" height="40" rx="4"/><rect x="284" y="234" width="30" height="40" rx="4"/>
    <rect x="140" y="304" width="52" height="40" rx="4"/><rect x="212" y="304" width="52" height="40" rx="4"/>
    <rect x="282" y="330" width="46" height="90" rx="5"/>
  </g>
  <!-- service riser -->
  <g stroke="#F5A623" stroke-width="16" fill="none" opacity="0.9" stroke-linecap="round">
    <path d="M356 420 V150 H382"/>
  </g>
</svg>
