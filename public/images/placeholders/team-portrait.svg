<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Licensed plumbing technician and service van">
  <defs>
    <linearGradient id="tp" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#e9f0f8"/>
      <stop offset="1" stop-color="#c7d9ec"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#tp)"/>
  <!-- horizon -->
  <polygon points="0,470 600,380 600,750 0,750" fill="#ffffff" opacity="0.4"/>
  <!-- service van -->
  <g opacity="0.5">
    <path d="M60 340 H420 a34 34 0 0 1 34 34 V470 H60 Z" fill="#1B4F8A"/>
    <path d="M420 374 H500 l52 62 V470 H420 Z" fill="#123A66"/>
    <rect x="436" y="386" width="72" height="42" rx="6" fill="#e9f0f8"/>
    <circle cx="150" cy="480" r="42" fill="#123A66"/>
    <circle cx="150" cy="480" r="17" fill="#e9f0f8"/>
    <circle cx="452" cy="480" r="42" fill="#123A66"/>
    <circle cx="452" cy="480" r="17" fill="#e9f0f8"/>
    <rect x="104" y="378" width="230" height="16" rx="8" fill="#F5A623"/>
    <rect x="104" y="410" width="168" height="12" rx="6" fill="#e9f0f8" opacity="0.8"/>
  </g>
  <!-- technician -->
  <g transform="translate(300 470)">
    <path d="M-96 280 V150 a96 96 0 0 1 192 0 V280 Z" fill="#1B4F8A" opacity="0.9"/>
    <circle cx="0" cy="66" r="62" fill="#123A66" opacity="0.9"/>
    <path d="M-70 30 a70 70 0 0 1 140 0 z" fill="#F5A623"/>
    <rect x="-70" y="22" width="140" height="16" rx="8" fill="#F5A623"/>
    <rect x="-14" y="160" width="28" height="86" rx="8" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
