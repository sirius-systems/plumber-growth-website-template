<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Residential and commercial plumbing">
  <defs>
    <linearGradient id="pc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#d3dfee"/>
    </linearGradient>
  </defs>
  <rect width="700" height="400" fill="url(#pc)"/>
  <polygon points="0,310 700,170 700,270 0,360" fill="#ffffff" opacity="0.35"/>
  <!-- house -->
  <g fill="#1B4F8A" opacity="0.55">
    <path d="M120 210 L215 130 L310 210 L310 320 L120 320 Z"/>
  </g>
  <g fill="#ffffff" opacity="0.75">
    <rect x="160" y="235" width="45" height="40" rx="4"/>
    <rect x="235" y="235" width="45" height="85" rx="4"/>
  </g>
  <!-- commercial building -->
  <g fill="#1B4F8A" opacity="0.4">
    <rect x="380" y="110" width="180" height="210" rx="6"/>
  </g>
  <g fill="#ffffff" opacity="0.7">
    <rect x="405" y="140" width="40" height="34" rx="3"/>
    <rect x="470" y="140" width="40" height="34" rx="3"/>
    <rect x="405" y="196" width="40" height="34" rx="3"/>
    <rect x="470" y="196" width="40" height="34" rx="3"/>
    <rect x="440" y="258" width="40" height="62" rx="3"/>
  </g>
  <!-- ground line + accent drop -->
  <rect x="60" y="320" width="580" height="8" rx="4" fill="#1B4F8A" opacity="0.3"/>
  <path d="M600 190 c22 30 34 48 34 62 a34 34 0 0 1 -68 0 c0 -14 12 -32 34 -62z" fill="#F5A623" opacity="0.85"/>
</svg>
