<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plumbing service placeholder">
  <defs>
    <linearGradient id="hb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4F8A"/>
      <stop offset="0.55" stop-color="#123A66"/>
      <stop offset="1" stop-color="#0d2b4c"/>
