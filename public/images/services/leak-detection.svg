<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Leak detection">
  <defs>
    <linearGradient id="ld" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf1f8"/>
      <stop offset="1" stop-color="#ccddee"/>
    </linearGradient>
  </defs>
  <rect width="700" height="400" fill="url(#ld)"/>
  <!-- slab -->
  <rect x="0" y="250" width="700" height="150" fill="#1B4F8A" opacity="0.16"/>
  <g stroke="#1B4F8A" stroke-width="4" opacity="0.25">
    <path d="M0 250 H700 M120 250 V400 M300 250 V400 M480 250 V400 M0 322 H700"/>
  </g>
  <!-- buried line + leak -->
  <g stroke="#1B4F8A" stroke-width="20" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M40 330 H660"/>
  </g>
  <g fill="#2f6bb0" opacity="0.55">
    <circle cx="400" cy="300" r="12"/>
    <circle cx="428" cy="278" r="8"/>
    <circle cx="378" cy="272" r="7"/>
  </g>
  <!-- acoustic waves -->
  <g stroke="#F5A623" stroke-width="7" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M356 240 a60 60 0 0 1 88 0"/>
    <path d="M330 208 a96 96 0 0 1 140 0"/>
  </g>
  <!-- magnifier -->
  <g transform="translate(212 168)" opacity="0.85">
    <circle cx="0" cy="0" r="86" fill="#ffffff" opacity="0.55"/>
    <circle cx="0" cy="0" r="86" fill="none" stroke="#123A66" stroke-width="18"/>
    <rect x="52" y="60" width="30" height="110" rx="15" transform="rotate(-42 52 60)" fill="#123A66"/>
  </g>
</svg>
