  <g fill="#1B4F8A" opacity="0.55">
    <rect x="236" y="222" width="26" height="56" rx="4"/>
    <rect x="392" y="222" width="26" height="56" rx="4"/>
  </g>
  <!-- escaping water -->
  <g fill="#2f6bb0" opacity="0.5">
