<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Emergency plumbing">
  <defs>
    <linearGradient id="eb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf1f8"/>
      <stop offset="1" stop-color="#cfe0f0"/>
    </linearGradient>
  </defs>
  <rect width="700" height="400" fill="url(#eb)"/>
  <polygon points="0,290 700,140 700,260 0,360" fill="#ffffff" opacity="0.35"/>
  <!-- ruptured supply line -->
  <g stroke="#1B4F8A" stroke-width="34" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M70 250 H250"/>
    <path d="M400 250 H630"/>
