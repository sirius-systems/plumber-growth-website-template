<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Drain cleaning">
  <defs>
    <linearGradient id="dc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f9"/>
      <stop offset="1" stop-color="#cbdcee"/>
    </linearGradient>
  </defs>
  <rect width="700" height="400" fill="url(#dc)"/>
  <polygon points="0,300 700,160 700,270 0,360" fill="#ffffff" opacity="0.35"/>
  <!-- basin -->
  <ellipse cx="270" cy="220" rx="180" ry="118" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="270" cy="220" rx="132" ry="86" fill="#2f6bb0" opacity="0.18"/>
  <!-- drain grate -->
  <circle cx="270" cy="220" r="48" fill="#1B4F8A" opacity="0.6"/>
  <g stroke="#eef3f9" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <path d="M240 200 H300 M240 220 H300 M240 240 H300"/>
  </g>
  <!-- swirl -->
  <g stroke="#2f6bb0" stroke-width="9" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M270 128 a92 92 0 0 1 84 92"/>
    <path d="M270 156 a64 64 0 0 0 -62 64"/>
  </g>
  <!-- auger cable -->
  <g stroke="#123A66" stroke-width="14" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M270 220 C 380 210 420 300 520 288"/>
  </g>
  <g transform="translate(566 282)" fill="#F5A623" opacity="0.9">
    <circle cx="0" cy="0" r="52"/>
    <circle cx="0" cy="0" r="20" fill="#123A66"/>
  </g>
</svg>
