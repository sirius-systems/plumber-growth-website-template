<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Water heater service">
  <defs>
    <linearGradient id="wh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2f8"/>
      <stop offset="1" stop-color="#cddeef"/>
